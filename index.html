<script>
(function(){
  function addPencils(){
    const rows = document.querySelectorAll('[class*="w-[84px]"]');
    rows.forEach(row=>{
      if(row.querySelector('button[title="Editar"]')) return;
      const name = row.textContent.trim();
      if(!name || name.length<2) return;
      // Only if looks like player name (not header)
      if(row.classList.contains('truncate') || row.textContent.includes('Díaz') || row.textContent.length<=18){
        // Actually target the div that contains player name
      }
    });
    // More robust: find all divs with w-[84px] shrink-0 truncate text-[11px] font-bold pr-1
    document.querySelectorAll('div.w-\[84px\].shrink-0.truncate').forEach(div=>{
      if(div.parentElement.querySelector('button[title="Editar"]')) return;
      const btn = document.createElement('button');
      btn.title='Editar';
      btn.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
      btn.className='w-[14px] h-[14px] shrink-0 grid place-items-center rounded hover:bg-black/5 ml-1';
      btn.onclick=()=>{
        const dorsal = prompt('Dorsal:', div.previousElementSibling? div.previousElementSibling.textContent : '');
        const nombre = prompt('Nombre:', div.textContent);
        if(dorsal && nombre){
          // Try to trigger React edit by dispatching events - fallback to alert
          // Since this is built file, we can't easily edit React state, so we just edit DOM
          div.textContent = nombre.slice(0,18);
          const container = div.closest('div.flex.items-center.h-\[42px\]');
          if(container){
            const dorsalDiv = container.querySelector('div.w-\[28px\]');
            if(dorsalDiv) dorsalDiv.textContent = dorsal;
          }
          // Add visual feedback
          btn.style.background='#fee2e2';
          setTimeout(()=>btn.style.background='', 500);
        }
      };
      div.style.display='flex';
      div.style.alignItems='center';
      div.style.gap='4px';
      div.appendChild(btn);
    });
  }
  // Try multiple times as React renders
  let tries=0;
  const iv=setInterval(()=>{
    addPencils();
    tries++;
    if(tries>30) clearInterval(iv);
  }, 500);
  document.addEventListener('DOMContentLoaded', addPencils);
})();
</script>
